<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>הגר נגב פלד - מסך קבלה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <style>
        :root {
            --bg: #fbf6ee;
            --panel: #ffffff;
            --hairline: #ece3d3;
            --ink: #3a3530;
            --stone: #8a8175;
            --teal: #5f9d9a;
            --teal-soft: #e7f2f1;
            --peach: #e2925a;
            --peach-soft: #fbeade;
            --lavender: #9b81bf;
            --lavender-soft: #f0eaf7;
        }

        html {
            color-scheme: light only;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Assistant', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--ink);
            height: 100vh;
        }
        .scale-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            transform-origin: top center;
        }

        /* כותרת עליונה */
        .header-bar {
            background-color: var(--panel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 26px;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
        }
        .clinic-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--teal);
        }
        .clinic-logo {
            height: 62px;
            width: 62px;
            border-radius: 14px;
            object-fit: cover;
        }
        .clinic-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .clinic-tagline {
            font-size: 0.85rem;
            color: var(--stone);
            font-weight: 400;
            margin-top: 2px;
        }
        .contact-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--teal-soft);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--teal);
        }

        /* גוף העמוד */
        .main-container {
            flex: 1;
            padding: clamp(8px, 2vh, 18px) 32px;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.5vh, 14px);
            justify-content: space-evenly;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            overflow-y: auto;
            min-height: 0;
        }

        /* שורת שעון + מזג אוויר */
        .hero-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            flex-shrink: 0;
            height: clamp(210px, 32vh, 300px);
        }
        .hero-card {
            background: var(--panel);
            border-radius: 18px;
            border: 1px solid var(--hairline);
            padding: 12px 22px;
            flex: 1;
            min-width: 260px;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .greeting {
            font-size: 1.4rem;
            color: var(--peach);
            font-weight: 600;
        }
        .welcome-line {
            font-size: 0.95rem;
            color: var(--stone);
            margin-top: 2px;
        }
        .time {
            font-size: clamp(2.8rem, 7vw, 4.4rem);
            font-weight: 800;
            line-height: 1;
            margin: 8px 0 6px;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .date { font-size: 1.15rem; color: var(--stone); }

        /* שירותי הקליניקה - כרטיס ריבועי-קומפקטי ליד השעון ומזג האוויר */
        .services-section {
            background: var(--panel);
            border-radius: 18px;
            border: 1px solid var(--hairline);
            padding: 14px 22px;
            display: flex;
            flex-direction: column;
            flex: 1.3;
            min-width: 260px;
            height: 100%;
        }
        .section-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 10px;
        }
        .services-viewport {
            flex: 1;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
        }
        .services-track {
            display: flex;
            flex-direction: column;
            gap: 10px;
            will-change: transform;
        }
        .services-track.scrolling {
            animation-name: scrollServices;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes scrollServices {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }
        .service-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1.5px solid transparent;
            overflow: hidden;
        }
        .service-item.diag { background: var(--teal-soft); border-color: var(--teal); }
        .service-item.treat { background: var(--peach-soft); border-color: var(--peach); }
        .service-item.groups { background: var(--lavender-soft); border-color: var(--lavender); }
        .service-tag {
            font-size: 1rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            color: #fff;
            flex-shrink: 0;
            white-space: nowrap;
            margin-top: 3px;
        }
        .service-tag.diag { background: var(--teal); }
        .service-tag.treat { background: var(--peach); }
        .service-tag.groups { background: var(--lavender); }
        .service-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .service-item .service-name {
            font-size: 1.4rem;
            color: var(--ink);
            font-weight: 700;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .service-item .service-desc {
            font-size: 1.2rem;
            color: var(--stone);
            line-height: 1.35;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* קרוסלת שאלות ותשובות להורים */
        .support-row {
            display: flex;
            gap: 14px;
            flex-shrink: 0;
            height: clamp(150px, 20vh, 210px);
        }
        .faq-banner {
            flex: 1;
            height: 100%;
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--hairline);
            border-right: 4px solid var(--lavender);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
            min-width: 0;
        }
        .faq-icon { font-size: 2.8rem; flex-shrink: 0; }
        .faq-content { flex: 1; transition: opacity 0.5s ease; min-width: 0; }
        .faq-question {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--lavender);
            margin-bottom: 10px;
        }
        .faq-answer {
            font-size: 1.2rem;
            color: var(--ink);
            line-height: 1.35;
        }
        .faq-dots {
            display: flex;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 5px;
            margin-top: 10px;
        }
        .faq-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hairline); flex-shrink: 0; }
        .faq-dot.active { background: var(--lavender); }

        /* קרוסלת ביקורות */
        .reviews-banner {
            flex: 1;
            height: 100%;
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--hairline);
            border-right: 4px solid var(--peach);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
            min-width: 0;
        }
        .review-icon { font-size: 2.4rem; flex-shrink: 0; }
        .review-content { flex: 1; transition: opacity 0.5s ease; min-width: 0; }
        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .review-name { font-size: 1.45rem; font-weight: 800; color: var(--ink); }
        .review-badge {
            font-size: 0.95rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 999px;
            color: #fff;
            white-space: nowrap;
        }
        .review-badge.google { background: #4285F4; }
        .review-badge.facebook { background: #3b5998; }
        .review-stars { font-size: 1.1rem; color: var(--peach); }
        .review-text {
            font-size: 1.3rem;
            color: var(--stone);
            line-height: 1.35;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .review-dots {
            display: flex;
            flex-wrap: nowrap;
            overflow: hidden;
            gap: 5px;
            margin-top: 10px;
        }
        .review-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hairline); flex-shrink: 0; }
        .review-dot.active { background: var(--peach); }

        /* פרטי יצירת קשר */
        .contact-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .contact-item {
            flex: 1;
            min-width: 190px;
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--hairline);
            padding: 16px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .contact-item .c-icon { font-size: 2.2rem; flex-shrink: 0; }
        .contact-item .c-label { font-size: 1.05rem; color: var(--stone); white-space: nowrap; }
        .contact-item .c-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            line-height: 1.25;
        }
        .contact-item > div:last-child { min-width: 0; overflow: visible; }
    </style>
</head>

    <script>
        const LAT = 32.119136, LON = 34.832632; // אוסקר שינדלר 40, תל אביב

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            const hour = now.getHours();
            let greeting = "ערב טוב";
            if (hour >= 5 && hour < 12) greeting = "בוקר טוב";
            else if (hour >= 12 && hour < 17) greeting = "צהריים טובים";
            else if (hour >= 17 && hour < 21) greeting = "ערב טוב";
            else greeting = "לילה טוב";
            document.getElementById('greeting').textContent = greeting;

            document.getElementById('date').textContent =
                now.toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        /* ===== רשימת שירותים - גלילה רציפה (כמו טיקר המבזקים) ===== */
        const services = [
            { type: 'diag', label: 'אבחון', name: 'אבחון בשלות', desc: 'בוחן בשלות רגשית וקוגניטיבית לקראת המעבר לכיתה א׳' },
            { type: 'diag', label: 'אבחון', name: 'אבחון הדלגה', desc: 'בוחן התאמה להקדמת מעבר לכיתה א׳ או דילוג בין כיתות' },
            { type: 'diag', label: 'אבחון', name: 'אבחון פסיכודיאגנוסטי', desc: 'הערכה פסיכולוגית מעמיקה של התפקוד הרגשי, הקוגניטיבי וההתנהגותי' },
            { type: 'diag', label: 'אבחון', name: 'אבחון דידקטי', desc: 'בוחן את התפקוד הלימודי של הילד ביחס לבני גילו' },
            { type: 'diag', label: 'אבחון', name: 'אבחון פסיכו-דידקטי', desc: 'משלב הערכה פסיכולוגית ודידקטית לאבחון מקיף של קשיי למידה' },
            { type: 'diag', label: 'אבחון', name: 'אבחון דידקטי באנגלית', desc: 'בוחן קשיי למידה ספציפיים בקריאה, כתיבה והבנה באנגלית' },
            { type: 'diag', label: 'אבחון', name: 'אבחון דידקטי במתמטיקה', desc: 'בוחן קשיי למידה ספציפיים בהבנה ובביצוע פעולות חשבוניות' },
            { type: 'diag', label: 'אבחון', name: 'אבחון קשב וריכוז', desc: 'אבחנה קלינית מבדלת לזיהוי הפרעת קשב ושלילת מצבים אחרים' },
            { type: 'diag', label: 'אבחון', name: 'הערכת קשב ממוחשבת (MOXO)', desc: 'מבחן קשב ממוחשב המשמש ככלי עזר להשלמת אבחון קשב' },
            { type: 'treat', label: 'טיפול', name: 'הוראה מותאמת (מתקנת)', desc: 'תוכנית התערבות אישית לצמצום פערים בקריאה, כתיבה וחשבון' },
            { type: 'treat', label: 'טיפול', name: 'אימון אסטרטגיות למידה והתארגנות', desc: 'הקניית כלים ללמידה עצמאית, תכנון וניהול זמן' },
            { type: 'treat', label: 'טיפול', name: 'ליווי לילדים ובני נוער מגן ועד י"ב', desc: 'ליווי אישי מותאם גיל לאורך שנות הלימודים' },
            { type: 'groups', label: 'קבוצה', name: 'קבוצת הכנה לכיתה א׳', desc: 'מקנה כלים דידקטיים, ניהוליים ורגשיים לקראת המעבר לכיתה א׳' },
            { type: 'groups', label: 'קבוצה', name: 'קבוצת קריאה וכתיבה (כיתה ב׳)', desc: 'מחזקת מיומנויות קריאה וכתיבה בסיסיות לילדי כיתה ב׳' },
            { type: 'groups', label: 'קבוצה', name: 'ליווי והדרכת מורות', desc: 'ליווי צוותי חינוך בתחומי האבחון, ההוראה ובניית קבוצות למידה' }
        ];

        const SERVICES_SCROLL_SPEED = 9; // פיקסלים לשנייה - איטי יותר

        function renderServicesTrack() {
            const track = document.getElementById('servicesTrack');
            const itemsHtml = services.map(s => `
                <div class="service-item ${s.type}">
                    <span class="service-tag ${s.type}">${s.label}</span>
                    <div class="service-text">
                        <span class="service-name">${s.name}</span>
                        <span class="service-desc">${s.desc}</span>
                    </div>
                </div>`).join('');

            track.classList.remove('scrolling');
            track.style.transform = 'translateY(0)';
            track.innerHTML = itemsHtml;

            const singleSetHeight = track.scrollHeight;
            const viewportHeight = track.parentElement.clientHeight;
            if (singleSetHeight <= viewportHeight) return;

            track.innerHTML = itemsHtml + itemsHtml;
            const duration = (singleSetHeight / SERVICES_SCROLL_SPEED).toFixed(1);
            track.style.animationDuration = duration + 's';
            void track.offsetHeight;
            track.classList.add('scrolling');
        }
        renderServicesTrack();
        window.addEventListener('resize', renderServicesTrack);

        /* ===== קרוסלת שאלות ותשובות להורים (מתוך עמוד השו"ת באתר) ===== */
        const faqs = [
            { q: 'מה ההבדל בין אבחון פסיכו-דידקטי לאבחון דידקטי?', a: 'פסיכו-דידקטי משלב גם בדיקת מנת משכל ועולם רגשי; דידקטי בודק רק תפקוד לימודי.' },
            { q: 'באבחון פסיכו-דידקטי אפשר גם לאבחן קשיי קשב וריכוז?', a: 'לא. הגורם היחיד המוסמך לכך הוא רופא מומחה, נוירולוג או פסיכיאטר.' },
            { q: 'אבחון דידקטי חייב לכלול גם חשבון ואנגלית?', a: 'לא בהכרח - הרחבה נעשית רק כשיש קושי ספציפי מדווח בתחום.' },
            { q: 'חבל לעשות אבחון בגלל רפורמת "מלקות ללמידה"?', a: 'לא נכון. משרד החינוך מחויב לקבל כל אבחון, בכל בית ספר.' },
            { q: 'בלי אבחון פסיכו-דידקטי לא אקבל שעות שילוב?', a: 'לא נכון. אפשר לקבל שעות שילוב גם עם אבחון דידקטי וטופס 8.' },
            { q: 'אפשר לאבחן לקות למידה כבר בכיתה א׳?', a: 'לא. המועד המוקדם ביותר לכך הוא רק בסוף כיתה ב׳.' },

        /* ===== מוזיקת רקע - רדיו חי (100FM Cafe, HLS) ===== */
        (function initRadio() {
            const audio = document.getElementById('bgMusic');
            const STREAM_URL = 'https://gb25.streamgates.net/radios-audio/100Cafe/chunks.m3u8?nimblesessionid=610469171';
            audio.volume = 0.5;

            function tryPlay() {
                audio.play().catch(() => {
                    const resume = () => { audio.play(); document.removeEventListener('click', resume); document.removeEventListener('touchstart', resume); };
                    document.addEventListener('click', resume, { once: true });
                    document.addEventListener('touchstart', resume, { once: true });
                });
            }

            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(STREAM_URL);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS fatal error, retrying...', data);
                        setTimeout(() => hls.loadSource(STREAM_URL), 5000);
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // תמיכה טבעית (Safari / iOS)
                audio.src = STREAM_URL;
                audio.addEventListener('loadedmetadata', tryPlay);
            } else {
                console.error('הדפדפן לא תומך בשידור HLS');
            }
        })();

    <script>
        /* ===== התאמה אוטומטית לגובה המסך בפועל - מבטיח שלא יהיה צורך בגלילה ===== */
        function fitToScreen() {
            const wrapper = document.getElementById('scaleWrapper');
            const header = wrapper.querySelector('.header-bar');
            const mainEl = wrapper.querySelector('.main-container');

            // גובה מדויק בפיקסלים, לא תלוי בחישוב vh של הדפדפן
            const exactHeight = window.innerHeight;
            document.body.style.height = exactHeight + 'px';
            wrapper.style.height = exactHeight + 'px';

            wrapper.style.transform = 'none';

            // תחילה בודקים בגודל טבעי (לא חתוך) כמה מקום התוכן צריך באמת
            mainEl.style.flex = 'none';
            mainEl.style.height = 'auto';
            mainEl.style.overflowY = 'visible';

            const naturalHeight = header.offsetHeight + mainEl.scrollHeight;
            const available = exactHeight;

            if (naturalHeight > available) {
                // התוכן גדול מדי - מכווצים את הכל יחד כדי שהכל יכנס בלי לחתוך
                const ratio = Math.max(0.5, available / naturalHeight);
                wrapper.style.transform = 'scale(' + ratio + ')';
            } else {
                // התוכן כבר נכנס בקלות - ממלאים את כל הגובה הפנוי (בלי רווח ריק למטה)
                wrapper.style.transform = 'none';
                mainEl.style.flex = '1';
                mainEl.style.height = '';
                mainEl.style.overflowY = 'auto';
            }
        }
        window.addEventListener('load', fitToScreen);
        window.addEventListener('resize', fitToScreen);
        setTimeout(fitToScreen, 800);  // ריצה נוספת אחרי שהפונט/תמונות נטענו במלואם
        setTimeout(fitToScreen, 2000); // ריצה שלישית ליתר ביטחון על מכשירים איטיים
        setInterval(fitToScreen, 5000); // בדיקה חוזרת קבועה - מתקנת כל פער שנוצר לאורך זמן
    </script>
